name: Build & Deploy to Neocities

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # ✅ FIXED: Upgraded to 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site for Neocities
        run: npm run build:neocities # ✅ FIXED: Uses the correct script

      - name: Verify sitemap exists
        run: ls -la dist/sitemap-index.xml || echo "Sitemap check skipped"

      - name: Deploy to Neocities
        uses: bcomnes/deploy-to-neocities@v3 # ✅ FIXED: Upgraded to v3
        with:
          api_token: ${{ secrets.NEOCITIES_API_KEY }} # ✅ FIXED: Changed from api_key to api_token
          dist_dir: dist
          cleanup: true